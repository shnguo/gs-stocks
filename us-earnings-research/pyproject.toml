[project]
name = "us-earnings-research"
version = "0.1.0"
description = "Reproducible SEC earnings event research with conservative execution timing"
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy>=2,<3",
  "pandas>=2.2,<3",
  "beautifulsoup4>=4.12,<5",
  "lxml>=5,<7",
  "matplotlib>=3.9,<4",
  "nbformat>=5.10,<6",
  "nbclient>=0.10,<1",
  "nbconvert>=7.16,<8",
  "ipykernel>=6.29,<8",
  "scikit-learn>=1.5,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/us_earnings"]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
