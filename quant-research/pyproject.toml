[project]
name = "ashare-quant-research"
version = "0.1.0"
description = "Reproducible non-ST A-share cross-sectional research"
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy>=2.0,<3", "pandas>=2.2,<3", "pyarrow>=18,<24",
  "scipy>=1.14,<2", "scikit-learn>=1.5,<2", "lightgbm>=4.5,<5",
  "torch>=2.5,<3",
  "einops>=0.8,<1",
  "huggingface-hub>=0.35,<2",
  "safetensors>=0.8,<1",
  "tqdm>=4.67,<5",
]

[project.scripts]
quant-research = "quant_research.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quant_research"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
